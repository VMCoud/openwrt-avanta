name: Build OpenWrt avanta

on:
  push:
    branches: [ avanta-latest ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-avanta
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-pip \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl \
            quilt patchutils cpio

      - name: Cache downloads (dl/)
        uses: actions/cache@v4
        with:
          path: dl
          key: avanta-dl-${{ hashFiles('feeds.conf.default') }}
          restore-keys: avanta-dl-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure avanta target (all 4 devices + LuCI)
        run: |
          echo "CONFIG_TARGET_avanta=y" > .config
          echo "CONFIG_TARGET_avanta_generic=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl-mbedtls=y" >> .config
          make defconfig
          # Target Profile is a Kconfig choice (single-select): defconfig
          # normalises multiple DEVICE_* flags to one. Write the 4 device
          # flags AFTER defconfig so `make` builds all of them.
          echo "CONFIG_TARGET_avanta_generic_DEVICE_zte_f420-f620=y" >> .config
          echo "CONFIG_TARGET_avanta_generic_DEVICE_zte_f460-f660=y" >> .config
          echo "CONFIG_TARGET_avanta_generic_DEVICE_zte_f460-f660-lp=y" >> .config
          echo "CONFIG_TARGET_avanta_generic_DEVICE_hqw_hgg420n=y" >> .config

      - name: Build firmware
        run: make -j$(nproc) V=s

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: avanta-firmware
          path: bin/targets/avanta/generic
          if-no-files-found: error
